<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Chatbot Pháp Luật Ma Túy</title>
    <style>
      :root {
        --brand: #1cb0f6;
        --brand-hover: #1497d4;
        --accent: #00b086;
        --text: #3c3c3c;
        --muted: #667085;
        --border: #d7dce2;
        --surface: #ffffff;
        --page: #f5f7fb;
        --soft-blue: #edf8ff;
        --soft-green: #eafaf4;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        --font: din-round, "Trebuchet MS", Helvetica, Arial, sans-serif;
        --font-size: 17px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body,
      button,
      textarea,
      select,
      input {
        color: var(--text);
        font-family: var(--font);
        font-size: var(--font-size);
        letter-spacing: 0;
        line-height: 24px;
      }

      body {
        background: var(--page);
      }

      button,
      textarea,
      select {
        outline: none;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 3fr 1fr;
        gap: 16px;
        height: 100vh;
        padding: 16px;
        width: 100vw;
      }

      .chat-panel,
      .sources-panel {
        background: var(--surface);
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        box-shadow: var(--shadow);
      }

      .chat-panel {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        height: calc(100vh - 32px);
        min-width: 0;
        overflow: hidden;
      }

      .topbar {
        align-items: center;
        border-bottom: 1px solid #eeeeee;
        display: flex;
        justify-content: space-between;
        min-height: 70px;
        padding: 18px 24px;
      }

      .brand-row {
        align-items: center;
        display: flex;
        gap: 12px;
      }

      .brand-mark {
        background: var(--brand);
        border-radius: 50%;
        box-shadow: 0 0 0 6px rgba(28, 176, 246, 0.12);
        height: 16px;
        width: 16px;
      }

      .brand-title {
        font-weight: 700;
      }

      .subtitle,
      .caption,
      .sources-header p {
        color: var(--muted);
        margin: 8px 0 0;
      }

      .status-stack {
        align-items: flex-end;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 150px;
      }

      .badge {
        background: var(--accent);
        border-radius: 2px;
        color: #ffffff;
        display: inline-block;
        font-weight: 700;
        padding: 4px 8px;
      }

      .badge-muted {
        background: #cccccc;
        color: #666666;
      }

      .badge-online {
        background: var(--accent);
        color: #ffffff;
      }

      .badge-error {
        background: #e53935;
        color: #ffffff;
      }

      .toolbar {
        align-items: center;
        background: #fbfdff;
        border-bottom: 1px solid #eeeeee;
        display: flex;
        gap: 16px;
        padding: 14px 24px;
      }

      .control,
      .toggle {
        align-items: center;
        display: flex;
        gap: 8px;
        font-weight: 700;
      }

      .toggle input {
        height: 18px;
        width: 18px;
      }

      select {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 8px;
        height: 40px;
        padding: 0 12px;
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 0;
        overflow-y: auto;
        padding: 20px 24px;
      }

      .message {
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        max-width: 88%;
        padding: 16px;
        white-space: pre-wrap;
      }

      .message.user {
        align-self: flex-end;
        background: var(--soft-blue);
        border-color: rgba(28, 176, 246, 0.3);
      }

      .message.assistant {
        align-self: flex-start;
        background: #ffffff;
      }

      .message-label {
        color: var(--brand);
        font-weight: 700;
        margin-bottom: 8px;
      }

      .message-meta {
        border-top: 1px solid #eeeeee;
        color: var(--muted);
        margin-top: 12px;
        padding-top: 8px;
      }

      .followup-row {
        border-top: 1px solid #eeeeee;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
        padding-top: 12px;
      }

      .followup-chip {
        background: var(--soft-green);
        border: 1px solid rgba(0, 176, 134, 0.28);
        border-radius: 12px;
        color: #08785e;
        cursor: pointer;
        font-weight: 700;
        min-height: 40px;
        padding: 0 12px;
      }

      .followup-chip:hover {
        background: #daf5eb;
      }

      .input-card {
        border-top: 1px solid #eeeeee;
        padding: 14px 24px 18px;
      }

      textarea {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 8px;
        min-height: 72px;
        padding: 12px 16px;
        resize: vertical;
        width: 100%;
      }

      textarea:focus,
      select:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(28, 176, 246, 0.12);
      }

      .input-actions {
        align-items: flex-end;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-top: 12px;
      }

      .sample-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
        min-height: 50px;
        padding: 0 16px;
      }

      .primary-button {
        background: var(--brand);
        border: none;
        color: #ffffff;
        min-width: 160px;
      }

      .primary-button:hover {
        background: var(--brand-hover);
      }

      .primary-button:disabled {
        background: #cccccc;
        color: #777777;
        cursor: not-allowed;
      }

      .secondary-button,
      .sample-button {
        background: transparent;
        border: 2px solid var(--brand);
        color: var(--brand);
      }

      .secondary-button:hover,
      .sample-button:hover {
        background: rgba(28, 176, 246, 0.1);
      }

      .sample-button {
        min-height: 44px;
      }

      .sources-panel {
        height: calc(100vh - 32px);
        max-height: calc(100vh - 32px);
        min-width: 0;
        overflow: hidden;
        position: sticky;
        top: 16px;
      }

      .sources-header {
        align-items: flex-start;
        border-bottom: 1px solid #eeeeee;
        display: flex;
        justify-content: space-between;
        padding: 18px 16px;
      }

      .sources-header h2 {
        font-size: var(--font-size);
        line-height: 24px;
        margin: 0;
      }

      .sources-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: calc(100vh - 142px);
        overflow-y: auto;
        padding: 14px;
      }

      .source-card {
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        padding: 14px;
      }

      .source-title {
        font-weight: 700;
        margin-bottom: 8px;
        overflow-wrap: anywhere;
      }

      .source-meta {
        color: var(--muted);
        margin-bottom: 8px;
      }

      .source-content {
        background: var(--page);
        border: 1px solid #eeeeee;
        border-radius: 8px;
        padding: 12px;
        white-space: pre-wrap;
      }

      @media (max-width: 900px) {
        html,
        body {
          overflow: auto;
        }

        .app-shell {
          grid-template-columns: 1fr;
          height: auto;
          padding: 16px;
          width: auto;
        }

        .chat-panel,
        .sources-panel {
          height: auto;
          max-height: none;
          min-height: auto;
        }

        .sources-panel {
          position: static;
        }

        .topbar,
        .toolbar,
        .input-actions {
          align-items: stretch;
          flex-direction: column;
        }

        .status-stack {
          align-items: flex-start;
        }

        .message {
          max-width: 100%;
        }

        .primary-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-panel">
        <header class="topbar">
          <div>
            <div class="brand-row">
              <span class="brand-mark"></span>
              <span class="brand-title">RAG Chatbot Pháp Luật Ma Túy</span>
            </div>
            <p class="subtitle">
              Hỏi đáp dựa trên văn bản pháp luật và bài báo đã crawl. Câu trả lời có citation và tài liệu liên quan.
            </p>
          </div>
          <div class="status-stack">
            <span id="backendStatus" class="badge badge-muted">Đang kiểm tra</span>
            <span id="apiStatus" class="caption">API: /chat</span>
          </div>
        </header>

        <div class="toolbar">
          <label class="control">
            <span>Source</span>
            <select id="topK">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="8">8</option>
            </select>
          </label>
          <label class="toggle">
            <input id="useLlm" type="checkbox" checked />
            <span>Gọi LLM API</span>
          </label>
          <button id="clearBtn" class="secondary-button" type="button">Xóa hội thoại</button>
        </div>

        <section id="messages" class="messages" aria-live="polite">
          <article class="message assistant">
            <div class="message-label">Chatbot</div>
            <div class="message-body">Nhập câu hỏi bên dưới để bắt đầu.</div>
          </article>
        </section>

        <form id="chatForm" class="input-card">
          <textarea
            id="questionInput"
            rows="3"
            placeholder="Nhập câu hỏi về pháp luật ma túy hoặc tin tức liên quan..."
          ></textarea>
          <div class="input-actions">
            <div class="sample-actions">
              <button class="sample-button" type="button">Hình phạt cho tội tàng trữ trái phép chất ma túy là gì?</button>
              <button class="sample-button" type="button">Luật Phòng, chống ma túy 2021 quy định gì về cai nghiện?</button>
            </div>
            <button id="sendBtn" class="primary-button" type="submit">Gửi câu hỏi</button>
          </div>
        </form>
      </section>

      <aside class="sources-panel">
        <div class="sources-header">
          <div>
            <h2>Tài liệu liên quan</h2>
            <p id="sourceHint">Source documents sẽ hiển thị sau khi chatbot trả lời.</p>
          </div>
          <span id="sourceCount" class="badge">0</span>
        </div>
        <div id="sources" class="sources-list"></div>
      </aside>
    </main>

    <script>
      const API_BASE = "";
      let sessionId = null;

      const messagesEl = document.querySelector("#messages");
      const sourcesEl = document.querySelector("#sources");
      const sourceCountEl = document.querySelector("#sourceCount");
      const sourceHintEl = document.querySelector("#sourceHint");
      const backendStatusEl = document.querySelector("#backendStatus");
      const apiStatusEl = document.querySelector("#apiStatus");
      const formEl = document.querySelector("#chatForm");
      const inputEl = document.querySelector("#questionInput");
      const sendBtn = document.querySelector("#sendBtn");
      const topKEl = document.querySelector("#topK");
      const useLlmEl = document.querySelector("#useLlm");
      const clearBtn = document.querySelector("#clearBtn");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function setBackendStatus(status, detail = "") {
        backendStatusEl.className = "badge";
        if (status === "online") {
          backendStatusEl.classList.add("badge-online");
          backendStatusEl.textContent = "Backend online";
        } else if (status === "error") {
          backendStatusEl.classList.add("badge-error");
          backendStatusEl.textContent = "Backend lỗi";
        } else {
          backendStatusEl.classList.add("badge-muted");
          backendStatusEl.textContent = "Backend offline";
        }
        apiStatusEl.textContent = detail || "API: /chat";
      }

      function clearWelcomeMessage() {
        const welcome = messagesEl.querySelector(".message.assistant");
        if (welcome && messagesEl.children.length === 1 && welcome.textContent.includes("Nhập câu hỏi")) {
          messagesEl.innerHTML = "";
        }
      }

      function buildFollowups(question, sources) {
        const hasLegal = (sources || []).some((source) => (source.metadata?.type || "").toLowerCase() === "legal");
        const hasNews = (sources || []).some((source) => (source.metadata?.type || "").toLowerCase() === "news");
        const suggestions = [];

        if (hasLegal) {
          suggestions.push("Nguồn luật nào là căn cứ chính cho câu trả lời này?");
          suggestions.push("Có điều khoản hoặc nghị định nào cần đọc kỹ hơn không?");
        }
        if (hasNews) {
          suggestions.push("Tin tức nào liên quan trực tiếp tới câu hỏi này?");
        }
        suggestions.push("Tóm tắt câu trả lời thành 3 ý ngắn gọn.");
        suggestions.push(`Giải thích rõ hơn câu: ${question.slice(0, 80)}`);
        return [...new Set(suggestions)].slice(0, 4);
      }

      function followupHtml(questions) {
        if (!questions || !questions.length) return "";
        const chips = questions
          .map((question) => `<button class="followup-chip" type="button" data-question="${escapeHtml(question)}">${escapeHtml(question)}</button>`)
          .join("");
        return `<div class="followup-row">${chips}</div>`;
      }

      function appendMessage(role, text, meta = {}) {
        clearWelcomeMessage();
        const article = document.createElement("article");
        article.className = `message ${role}`;
        const label = role === "user" ? "Bạn" : "Chatbot";
        const metaHtml = role === "assistant"
          ? `<div class="message-meta">Generation: ${escapeHtml(meta.generationMode || "unknown")} | Retrieval: ${escapeHtml(meta.retrievalSource || "unknown")}</div>`
          : "";

        article.innerHTML = `
          <div class="message-label">${label}</div>
          <div class="message-body">${escapeHtml(text || "")}</div>
          ${metaHtml}
          ${role === "assistant" ? followupHtml(meta.followups || []) : ""}
        `;
        messagesEl.appendChild(article);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function renderSources(sources) {
        sourceCountEl.textContent = String((sources || []).length);
        sourcesEl.innerHTML = "";

        if (!sources || !sources.length) {
          sourceHintEl.textContent = "Không có tài liệu liên quan cho câu trả lời này.";
          return;
        }

        sourceHintEl.textContent = "Các chunk được retrieval dùng để tạo câu trả lời.";
        sources.forEach((source, index) => {
          const metadata = source.metadata || {};
          const card = document.createElement("article");
          card.className = "source-card";
          card.innerHTML = `
            <div class="source-title">${index + 1}. ${escapeHtml(metadata.source || "unknown")}</div>
            <div class="source-meta">Type: ${escapeHtml(metadata.type || "unknown")} | Score: ${Number(source.score || 0).toFixed(3)} | Via: ${escapeHtml(source.source || "hybrid")}</div>
            <div class="source-content">${escapeHtml(String(source.content || "").slice(0, 1400))}</div>
          `;
          sourcesEl.appendChild(card);
        });
      }

      async function checkHealth() {
        try {
          const response = await fetch(`${API_BASE}/health`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          setBackendStatus("online", `API: /chat | LLM key: ${data.llm_configured ? "ready" : "not configured"}`);
        } catch (error) {
          setBackendStatus("offline", `Không kết nối backend: ${error.message}`);
        }
      }

      async function sendQuestion(question) {
        appendMessage("user", question);
        sendBtn.disabled = true;
        sendBtn.textContent = "Đang trả lời...";

        try {
          const response = await fetch(`${API_BASE}/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: question,
              session_id: sessionId,
              top_k: Number(topKEl.value),
              use_memory: true,
              use_llm: useLlmEl.checked,
            }),
          });

          if (!response.ok) {
            const text = await response.text();
            throw new Error(`HTTP ${response.status}: ${text}`);
          }

          const data = await response.json();
          const sources = data.sources || [];
          sessionId = data.session_id;
          appendMessage("assistant", data.answer || "Tôi không thể xác minh thông tin này từ nguồn hiện có.", {
            generationMode: data.generation_mode,
            retrievalSource: data.retrieval_source,
            followups: buildFollowups(question, sources),
          });
          renderSources(sources);
          setBackendStatus("online", `API: /chat | Mode: ${data.generation_mode || "unknown"}`);
        } catch (error) {
          appendMessage("assistant", `Backend lỗi hoặc chưa sẵn sàng: ${error.message}`, {
            generationMode: "error",
            retrievalSource: "none",
            followups: ["Thử lại với câu hỏi ngắn hơn.", "Kiểm tra backend đã chạy chưa?"],
          });
          renderSources([]);
          setBackendStatus("error", error.message);
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = "Gửi câu hỏi";
        }
      }

      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        const question = inputEl.value.trim();
        if (!question) return;
        inputEl.value = "";
        sendQuestion(question);
      });

      document.addEventListener("click", (event) => {
        const followup = event.target.closest(".followup-chip");
        if (followup) {
          sendQuestion(followup.dataset.question || followup.textContent.trim());
        }
      });

      document.querySelectorAll(".sample-button").forEach((button) => {
        button.addEventListener("click", () => {
          inputEl.value = button.textContent.trim();
          inputEl.focus();
        });
      });

      clearBtn.addEventListener("click", () => {
        sessionId = null;
        messagesEl.innerHTML = `
          <article class="message assistant">
            <div class="message-label">Chatbot</div>
            <div class="message-body">Nhập câu hỏi bên dưới để bắt đầu.</div>
          </article>
        `;
        renderSources([]);
      });

      checkHealth();
      renderSources([]);
    </script>
  </body>
</html>
